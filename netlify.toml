# Netlify deployment configuration.
# The site is generated by a Python script into dist/. Netlify runs the build
# command, then publishes the dist/ folder.

[build]
  command = "pip install -r requirements.txt && python3 site/build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.9"

# Pretty 404s
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Long-cache static assets (charts, css, js are content-addressed by edits)
[[headers]]
  for = "/charts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
